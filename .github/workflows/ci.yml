# The same gates the pre-push hook runs (.pre-commit-config.yaml), on a clean runner, so a
# contributor without the hooks installed still gets the verdict on their pull request.
# Live tests (-m live) are never run here: they need a controller.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright src/
      - name: Tests (coverage floor from pyproject.toml)
        run: uv run pytest -m "not live" --cov --cov-branch --cov-report=term
      - name: Build
        run: uv build
      - name: Smoke-test the wheel from outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          uv venv smoke --python ${{ matrix.python }}
          uv pip install --python smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          for entry in unifi-mapper unifi-mcp unifi-network-toolkit unifi-inventory; do
            smoke/bin/$entry --version
            smoke/bin/$entry --help > /dev/null
          done
          smoke/bin/unifi-mapper diagnose all --help > /dev/null

  macos:
    # The scheduler's launchd path and the shell-level tests run on macOS too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -m "not live" tests/test_unifi_cron.py tests/test_discover_defaults.py tests/test_first_run_surface.py -q
      - name: Scheduler status in a scratch HOME
        run: HOME="$RUNNER_TEMP" LOG_DIR="$RUNNER_TEMP/logs" bash scripts/unifi-cron.sh status
