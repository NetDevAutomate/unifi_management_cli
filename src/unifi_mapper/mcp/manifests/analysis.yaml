category: analysis
description: Network analysis tools for UniFi infrastructure

tools:
  detect_ip_conflicts:
    module: unifi_mapper.analysis.ip_conflicts
    handler: detect_ip_conflicts
    title: Detect IP Conflicts
    cli: analyze ip-conflicts
    description: Find IP address conflicts between devices on the network
    priority: P1
    tags: [ip, conflict, layer3, diagnostic]

  detect_storms:
    module: unifi_mapper.analysis.storm_detection
    handler: detect_storms
    title: Detect Storms
    cli: analyze storms
    description: Detect broadcast and multicast storms on network segments
    priority: P1
    tags: [broadcast, multicast, storm, layer2, diagnostic]

  diagnose_vlans:
    module: unifi_mapper.analysis.vlan_diagnostics
    handler: diagnose_vlans
    title: Diagnose VLANs
    cli: diagnose vlans
    description: Comprehensive VLAN diagnostics and configuration validation
    priority: P1
    tags: [vlan, layer2, configuration, diagnostic]

  analyze_link_quality:
    module: unifi_mapper.analysis.link_quality
    handler: analyze_link_quality
    title: Analyze Link Quality
    cli: analyze link-quality
    description: Port health and error analysis for link quality assessment
    priority: P2
    tags: [port, health, errors, performance]

  get_capacity_report:
    module: unifi_mapper.analysis.capacity_planning
    handler: get_capacity_report
    title: Get Capacity Report
    cli: analyze capacity
    description: Network capacity planning and utilization report
    priority: P2
    tags: [capacity, planning, utilization, report]

  monitor_lags:
    module: unifi_mapper.analysis.lag_monitoring
    handler: monitor_lags
    title: Monitor LAGs
    cli: analyze lags
    description: LAG (Link Aggregation Group) health monitoring
    priority: P2
    tags: [lag, aggregation, redundancy, health]

  find_lag_candidates:
    module: unifi_mapper.analysis.lag_monitoring
    handler: find_lag_candidates
    title: Find LAG Candidates
    cli: analyze lag-candidates
    description: Find parallel healthy links that could be configured as LACP LAGs
    priority: P2
    tags: [lag, aggregation, lacp, candidate, capacity]

  audit_mtu_consistency:
    module: unifi_mapper.analysis.mtu_audit
    handler: audit_mtu_consistency
    title: Audit MTU Consistency
    cli: analyze mtu
    description: Audit MTU and jumbo-frame consistency across inter-switch links
    priority: P2
    tags: [mtu, jumbo, switch, uplink, validation]

  analyze_radio_optimization:
    module: unifi_mapper.analysis.radio_optimization
    handler: analyze_radio_optimization
    title: Analyze Radio Optimization
    cli: analyze radio
    description: Analyze Wi-Fi radio channel reuse and transmit power settings
    priority: P2
    tags: [wifi, radio, channel, transmit-power, optimization]

  audit_sfp_diagnostics:
    module: unifi_mapper.analysis.sfp_diagnostics
    handler: audit_sfp_diagnostics
    title: Audit SFP Diagnostics
    cli: analyze sfp
    description: Pull SFP/SFP+ module identity and DOM diagnostics from UniFi port tables
    priority: P2
    tags: [sfp, transceiver, optics, dom, diagnostics]

  audit_vlan_coverage:
    module: unifi_mapper.analysis.vlan_coverage
    handler: audit_vlan_coverage
    title: Audit VLAN Coverage
    cli: analyze vlan-coverage
    description: Check required VLAN coverage on trunk and planned uplink ports
    priority: P2
    tags: [vlan, trunk, uplink, flex-xg, validation]
    parameters:
      required_vlans:
        type: array
        required: true
        description: VLAN IDs every trunk and planned uplink must carry
      planned_uplinks:
        type: array
        description: Planned uplink ports (names or {device, port} objects) to check as well

  audit_link_speeds:
    module: unifi_mapper.analysis.link_speed_audit
    handler: audit_link_speeds
    title: Audit Link Speeds
    cli: analyze link-speeds
    credentials: controller
    description: >-
      Fleet-wide audit of negotiated switch-port speeds. Flags half duplex,
      ports forced to a speed that are down or linked at another rate, and
      autonegotiated ports below their Integration API maxSpeedMbps (the
      10G-at-5G downgrade). Raw speed_caps is never decoded, only compared for
      equality between ports when the Integration API has no capability.
      Stale devices are excluded. Paged findings. Read-only.
    priority: P1
    tags: [port, speed, autoneg, duplex, negotiation, link, audit, read-only]
    parameters:
      switch:
        type: string
        description: Audit only this switch (name, MAC or IP); omit for every switch
      include_ok:
        type: boolean
        description: Also list ports with unknown capability and healthy up ports
      limit:
        type: integer
        description: Maximum findings to return (1-1000)
      offset:
        type: integer
        description: Findings to skip, for paging

  audit_port_profile_usage:
    module: unifi_mapper.analysis.port_profile_usage
    handler: audit_port_profile_usage
    title: Audit Port Profile Usage
    cli: analyze port-profile-usage
    credentials: controller
    description: >-
      Where every port profile is applied (each port's effective profile, the
      override winning over the port table) and which profiles are traps.
      Flags profiles that force a speed, port overrides that shadow their
      profile's speed, autoneg or native network, ports referencing a deleted
      profile, duplicate and unused profiles. Paged profiles. Read-only.
    priority: P1
    tags: [port, profile, portconf, speed, autoneg, override, audit, read-only]
    parameters:
      profile:
        type: string
        description: Report only this port profile (exact name or _id); omit for all
      include_unused:
        type: boolean
        description: List profiles no port uses (UNUSED_PROFILE)
      limit:
        type: integer
        description: Maximum profiles to return (1-1000)
      offset:
        type: integer
        description: Profiles to skip, for paging

  detect_foreign_bridges:
    module: unifi_mapper.analysis.foreign_bridges
    handler: detect_foreign_bridges
    title: Detect Foreign Bridges
    cli: analyze foreign-bridges
    description: >-
      Detect wired third-party (foreign) bridges inside the UniFi L2 domain - consumer mesh
      units and unmanaged switches that forward frames but do not participate in RSTP.
      Flags CRITICAL when one bridge touches two switch ports (an L2 loop spanning tree
      cannot break) or sits on a trunk profile (exports every VLAN to its fabric).
    priority: P1
    tags: [loop, l2, third-party, bridge, mesh, eero, rstp, bpdu, trunk, storm]

  summarise_freshness:
    module: unifi_mapper.analysis.device_freshness
    handler: summarise_freshness
    title: Summarise Device Freshness
    cli: diagnose freshness
    description: >-
      Classify whether each device's reported telemetry is live or a stale snapshot, using
      state plus last_seen age. The controller returns complete plausible port tables for
      devices that stopped informing hours ago; call this before trusting any port state.
    priority: P1
    tags: [freshness, stale, telemetry, last-seen, snapshot, diagnosis-hygiene]

  check_device_freshness:
    module: unifi_mapper.analysis.device_freshness
    handler: check_device_freshness
    title: Check Device Freshness
    cli: diagnose freshness
    idempotent: false
    description: >-
      Authoritative two-sample freshness check - verifies last_seen, uptime and cumulative
      counters actually advance, using healthy peers as the control. SLOW: sleeps ~200s
      between samples because devices only inform every 75-90s. Distinguishes reboots
      (uptime reset) from staleness, and reports inconclusive if no peer advanced.
    priority: P2
    tags: [freshness, stale, telemetry, two-sample, counters, reboot-detection]

  audit_power_budget:
    module: unifi_mapper.analysis.power_budget
    handler: audit_power_budget
    title: Audit Power Budget
    cli: analyze power-budget
    description: >-
      Audit switch INPUT power headroom - whether a switch's own power source (DC adapter or
      PoE-in) can run its active PHYs. Distinct from PoE output budget. Catches the failure
      where a compact multi-gig switch on an undersized adapter reboots as more ports go
      active. Only reports against published vendor figures; unlisted models yield no ceiling.
    priority: P1
    tags: [power, psu, poe-input, watts, reboot-loop, brownout, phy, capacity]

  check_poe_budget:
    module: unifi_mapper.analysis.poe_budget
    handler: check_poe_budget
    title: Check PoE Budget
    cli: analyze poe-budget
    credentials: controller
    description: >-
      PoE OUTPUT budget per switch - watts drawn by powered devices against the
      switch's PoE budget, headroom and high-draw ports (over 5 W). WARNING at 80%,
      CRITICAL at 90%. Distinct from audit_power_budget, which audits the switch's
      own input power. Read-only.
    priority: P2
    tags: [poe, power, budget, watts, switch, capacity, read-only]

  check_uplink_redundancy:
    module: unifi_mapper.analysis.uplink_redundancy
    handler: check_uplink_redundancy
    title: Check Uplink Redundancy
    cli: analyze uplink-redundancy
    credentials: controller
    description: >-
      Count the uplink ports of every switch with their speed and state, and flag
      switches with a single uplink (a single point of failure) or none. Read-only.
    priority: P2
    tags: [uplink, redundancy, spof, switch, topology, read-only]

  analyze_client_density:
    module: unifi_mapper.analysis.client_density
    handler: analyze_client_density
    title: Analyze Client Density
    cli: analyze client-density
    credentials: controller
    description: >-
      Wireless clients per access point with average signal strength. WARNING above
      30 clients on one AP, CRITICAL above 50. Read-only.
    priority: P2
    tags: [wifi, clients, density, access-point, capacity, read-only]

  check_dhcp_pool_utilization:
    module: unifi_mapper.analysis.dhcp_pool
    handler: check_dhcp_pool_utilization
    title: Check DHCP Pool Utilization
    cli: analyze dhcp-pools
    credentials: controller
    description: >-
      DHCP pool utilisation per DHCP-enabled network - active clients against the
      configured range. WARNING at 80%, CRITICAL at 90% (near exhaustion). Read-only.
    priority: P2
    tags: [dhcp, pool, ip, exhaustion, layer3, capacity, read-only]

  audit_uplink_transparency:
    module: unifi_mapper.analysis.uplink_transparency
    handler: audit_uplink_transparency
    title: Audit Uplink Transparency
    cli: analyze uplink-transparency
    description: >-
      Detect switches whose elected uplink port cannot carry tagged VLANs (for example a
      switch that re-homed onto an access port with tagged_vlan_mgmt=block_all), which
      silently severs every tagged VLAN behind it while untagged traffic keeps working
    priority: P1
    tags: [vlan, uplink, trunk, access-port, management-vlan, loop, third-party-bridge]

  analyze_traffic_matrix:
    module: unifi_mapper.analysis.traffic_matrix
    handler: analyze_traffic_matrix
    title: Analyze Traffic Matrix
    cli: analyze traffic-matrix
    description: >-
      Analyze available UniFi traffic statistics for top flows and 10G placement hints. For
      per-VLAN throughput history, get_vlan_traffic_report reads the local VLAN traffic store.
    priority: P2
    tags: [traffic, matrix, top-talkers, capacity, 10g]

  get_vlan_traffic_report:
    module: unifi_mapper.analysis.vlan_traffic_store
    handler: get_vlan_traffic_report
    title: Get VLAN Traffic Report
    cli: vlan-traffic report
    credentials: none
    open_world: false
    description: >-
      Per-VLAN average and peak receive and transmit bits per second over a period, from the
      local store that `unifi-mapper vlan-traffic sample` fills by reading the gateway's
      bridge byte counters (a CLI command, run by a person; nothing here starts a sample). now,
      1d and 1w read raw samples (kept 8 days), 1m hourly rollups and 1y daily rollups, each up
      to the newest complete hour or day that `unifi-mapper vlan-traffic rollup` has rolled;
      methodology names the tier. Every tier's peak is the largest sample rate in its window,
      so bursts shorter than the sampling interval are under-represented in every tier. Needs
      no credentials and sends no request; a missing store is NO_DATA. analyze_traffic_matrix
      reads the controller's own traffic statistics instead. Read-only.
    priority: P2
    tags: [vlan, traffic, throughput, bandwidth, history, trend, read-only]
    parameters:
      period:
        type: string
        required: true
        description: now, 1d, 1w, 1m or 1y

  list_vlan_traffic_periods:
    module: unifi_mapper.analysis.vlan_traffic_store
    handler: list_vlan_traffic_periods
    title: List VLAN Traffic Periods
    cli: vlan-traffic coverage
    credentials: none
    open_world: false
    description: >-
      What the local VLAN traffic store holds per tier (raw, hourly, daily): earliest and
      latest time, row count and gaps over 5 minutes, so an idle VLAN (0 bps) can be told
      from a window with no samples. Needs no credentials and sends no request; a missing
      store is NO_DATA. Read-only.
    priority: P2
    tags: [vlan, traffic, coverage, history, read-only]

  validate_port_profiles:
    module: unifi_mapper.analysis.port_profile_validation
    handler: validate_port_profiles
    title: Validate Port Profiles
    cli: analyze port-profiles
    description: Validate STP Edge, BPDU Guard, and uplink safety on applied port profiles
    priority: P2
    tags: [port-profile, stp, bpdu-guard, edge, validation]

  validate_qos:
    module: unifi_mapper.analysis.qos_validation
    handler: validate_qos
    title: Validate QoS
    cli: analyze qos
    description: QoS configuration validation and policy checking
    priority: P2
    tags: [qos, quality, policy, validation]

  analyze_mac_table:
    module: unifi_mapper.analysis.mac_analyzer
    handler: analyze_mac_table
    title: Analyze MAC Table
    cli: analyze mac-table
    description: MAC address table analysis and flapping detection
    priority: P3
    tags: [mac, layer2, flapping, table]

  get_firmware_report:
    module: unifi_mapper.analysis.firmware_advisor
    handler: get_firmware_report
    title: Get Firmware Report
    cli: inventory check-updates
    description: Firmware security assessment and update recommendations
    priority: P3
    tags: [firmware, security, update, advisory]

  get_device_inventory:
    module: unifi_mapper.analysis.device_inventory
    handler: get_device_inventory
    title: Get Device Inventory
    cli: inventory list
    description: >-
      Every device the controller lists, grouped as firewall (gateways), switch, ap or
      other, with model, firmware, address, state and the upgrade the controller offers;
      per type, firmware versions and models with counts. The counts cover the whole site,
      the devices and summaries the type asked for. Read-only.
    priority: P1
    tags: [inventory, devices, firmware, model, read-only]
    parameters:
      device_type:
        type: string
        description: all, firewall, switch, ap or other (default all)

  get_firmware_drift:
    module: unifi_mapper.analysis.device_inventory
    handler: get_firmware_drift
    title: Get Firmware Drift
    cli: inventory firmware-skew
    description: >-
      Models whose devices run mixed firmware versions: each version's devices, the newest
      version any of them runs and the devices behind it, the upgrades the controller
      currently offers, and the kept devices that are not connected (their version is the
      last one reported). Read-only.
    priority: P2
    tags: [firmware, skew, drift, inventory, upgrade, read-only]
    parameters:
      device_type:
        type: string
        description: all, firewall, switch or ap (default all)

  get_port_naming_capabilities:
    module: unifi_mapper.analysis.port_naming_capabilities
    handler: get_port_naming_capabilities
    title: Get Port Naming Capabilities
    cli: capabilities
    description: >-
      Port-naming support per gateway and switch, from model and firmware: full API support,
      UI-only, limited, auto-resetting firmware or unsupported, with the known issues and
      workarounds for each flagged device, and whether automated port naming (the CLI's
      discover and ports refresh) is recommended for this network. Read-only.
    priority: P2
    tags: [capabilities, port-naming, firmware, model, compatibility, read-only]

  detect_config_drift:
    module: unifi_mapper.analysis.config_drift
    handler: detect_drift_mcp
    title: Detect Config Drift
    cli: analyze config-drift
    description: >-
      Compare device configuration against a baseline `unifi-mapper analyze config-drift
      --snapshot` wrote: every tracked field that changed, was removed or was added since,
      per device, and devices the baseline knows that are gone. Compare only, never writes a
      baseline. The baseline path must be absolute and end in .json. Read-only.
    priority: P2
    tags: [config, drift, baseline, change, audit, read-only]
    parameters:
      baseline_path:
        type: string
        required: true
        description: Absolute path of the baseline .json file

  compare_link_errors:
    module: unifi_mapper.analysis.link_error_tracking
    handler: compare_link_errors_mcp
    title: Compare Link Errors
    cli: analyze link-errors
    description: >-
      Port error counters now against the baseline `unifi-mapper analyze link-errors
      --snapshot` wrote: per port the error and drop deltas and the rate per minute, ports
      over the threshold flagged, devices that rebooted since the baseline listed (shown, not
      flagged). Compare only, never writes the baseline or the counter history. Omit the path
      for the default under the XDG state directory. Read-only.
    priority: P2
    tags: [port, errors, counters, baseline, degradation, read-only]
    parameters:
      baseline_path:
        type: string
        description: Absolute path of the baseline .json file (default the XDG state baseline)
      threshold_errors_per_min:
        type: number
        description: Flag ports above this error rate (0.1-100000, default 10)

  analyze_client_roaming:
    module: unifi_mapper.analysis.roaming_analysis
    handler: analyze_roaming_mcp
    title: Analyze Client Roaming
    cli: analyze roaming
    description: >-
      Roaming and sticky clients from the history `unifi-mapper analyze roaming --snapshot`
      builds up (at least two snapshots): clients that roamed between APs with the APs used
      and their mean RSSI, and sticky clients that stay on a weak AP. Compare only, never
      records a snapshot. The history path must be absolute and end in .json. Read-only.
    priority: P2
    tags: [wifi, roaming, sticky, clients, rssi, read-only]
    parameters:
      history_path:
        type: string
        required: true
        description: Absolute path of the roaming history .json file

  scan_neighbour_aps:
    module: unifi_mapper.analysis.neighbour_scan
    handler: scan_neighbours
    title: Scan Neighbour APs
    cli: analyze neighbours
    description: >-
      Neighbouring access points and interference sources from the controller's passive
      background scan (stat/rogueap): per neighbour the SSID, BSSID, channel, band, signal
      and the UniFi AP that hears it, with per-channel congestion. No scan is triggered and
      nothing waits; the data is what the APs reported last. Read-only.
    priority: P2
    tags: [wifi, neighbours, interference, channel, rogue, read-only]
    parameters:
      ap_name:
        type: string
        description: Only the neighbours one AP hears (default every AP)

  compare_neighbour_baseline:
    module: unifi_mapper.analysis.neighbour_trend
    handler: detect_neighbour_trend_mcp
    title: Compare Neighbour Baseline
    cli: analyze neighbours
    description: >-
      The neighbouring APs seen now against the baseline `unifi-mapper analyze neighbours
      --snapshot` wrote: new and disappeared neighbours, channel moves and signal changes of
      at least the threshold. Read live and compared in memory; never writes a baseline. The
      baseline path must be absolute and end in .json. Read-only.
    priority: P3
    tags: [wifi, neighbours, baseline, trend, interference, read-only]
    parameters:
      baseline_path:
        type: string
        required: true
        description: Absolute path of the baseline .json file
      signal_delta_threshold:
        type: integer
        description: dB change that counts as a signal change (1-60, default 10)

  discover_stp_topology:
    module: unifi_mapper.analysis.stp_optimizer
    handler: discover_stp_topology
    title: Discover STP Topology
    cli: stp analyze
    description: Discover current STP topology from all switches
    priority: P2
    tags: [stp, spanning-tree, topology, discovery]

  audit_stp_priorities:
    module: unifi_mapper.analysis.stp_audit
    handler: audit_stp_priorities
    title: Audit STP Priorities
    cli: stp audit-priorities
    description: >-
      One-shot STP priority audit for the whole fleet, or narrowed to one switch: each
      switch's current, recommended and delta bridge priority and tier, a warning when
      switches tie at the lowest priority unless every one is core-class (the root would be
      decided by MAC), and the gateway under skipped (its bridge runs with STP disabled).
      Tiers always come from
      the whole fleet; narrowed to one switch, compliant and summary describe that switch and
      fleet_compliant and fleet_summary the fleet. Remediation names the CLI commands (stp
      optimize --plan, then stp apply --plan, which previews unless --no-dry-run); STP writes
      never run over MCP. Read-only.
    priority: P1
    tags: [stp, spanning-tree, priority, audit, root, read-only]
    parameters:
      device:
        type: string
        description: Only this switch, by name, MAC or ID (default the whole fleet)

  calculate_optimal_priorities:
    module: unifi_mapper.analysis.stp_optimizer
    handler: calculate_optimal_priorities
    title: Calculate Optimal Priorities
    cli: stp optimize
    pipeline: true
    description: Calculate optimal bridge priorities based on network hierarchy
    priority: P2
    tags: [stp, spanning-tree, priority, optimization]
    parameters:
      topology:
        type: object
        required: true
        description: STPTopology from discover_stp_topology

  generate_stp_report:
    module: unifi_mapper.analysis.stp_optimizer
    handler: generate_stp_report
    title: Generate STP Report
    cli: stp report
    pipeline: true
    description: Generate comprehensive STP optimization report
    priority: P2
    tags: [stp, spanning-tree, report, analysis]
    parameters:
      topology:
        type: object
        required: true
        description: STPTopology from discover_stp_topology
      changes:
        type: array
        required: true
        description: STPChange objects from calculate_optimal_priorities

  apply_stp_changes:
    module: unifi_mapper.analysis.stp_optimizer
    handler: apply_stp_changes
    title: Apply STP Changes
    cli: stp apply
    mutates: true   # writes live controller config - CLI only, never via MCP execute_tool
    description: Apply STP priority changes via API (supports dry-run mode)
    priority: P2
    tags: [stp, spanning-tree, configuration, apply]
    parameters:
      changes:
        type: array
        required: true
        description: STPChange objects to apply (CLI only; refused over MCP)
      dry_run:
        type: boolean
        default: true
        description: Preview changes without applying

  format_stp_report_markdown:
    module: unifi_mapper.analysis.stp_optimizer
    handler: format_stp_report_markdown
    title: Format STP Report as Markdown
    cli: stp report
    pipeline: true
    description: Format STP report as markdown with mermaid diagrams
    priority: P3
    tags: [stp, spanning-tree, report, markdown, mermaid]
    parameters:
      report:
        type: object
        required: true
        description: STPOptimizationReport from generate_stp_report

  audit_stp_path_costs:
    module: unifi_mapper.analysis.stp_optimizer
    handler: audit_stp_path_costs
    title: Audit STP Path Costs
    cli: stp path-costs
    pipeline: true
    description: Audit STP path costs for IEEE long-path-cost consistency
    priority: P2
    tags: [stp, spanning-tree, path-cost, 10g, validation]
    parameters:
      topology:
        type: object
        required: true
        description: STPTopology from discover_stp_topology

  validate_10g_expansion_readiness:
    module: unifi_mapper.analysis.stp_optimizer
    handler: validate_10g_expansion_readiness
    title: Validate 10G Expansion Readiness
    cli: stp validate-10g
    description: Validate STP, 10G link readiness, and port errors before adding USW Flex XG switches
    priority: P2
    tags: [stp, spanning-tree, 10g, flex-xg, validation, errors]
    parameters:
      planned_flex_xg_switches:
        type: integer
        default: 2
        description: Number of USW Flex XG switches planned for installation
      target_speed_mbps:
        type: integer
        default: 10000
        description: Target uplink speed in Mbps
      drops_threshold:
        type: integer
        default: 100000
        description: Port drop counter above which a link is flagged

  format_10g_validation_report_markdown:
    module: unifi_mapper.analysis.stp_optimizer
    handler: format_10g_validation_report_markdown
    title: Format 10G Validation Report as Markdown
    cli: stp validate-10g
    pipeline: true
    description: Format 10G expansion validation report as markdown
    priority: P3
    tags: [stp, 10g, report, markdown]
    parameters:
      report:
        type: object
        required: true
        description: STPNetworkValidationReport from validate_10g_expansion_readiness

  create_stp_change_plan:
    module: unifi_mapper.analysis.stp_change_plan
    handler: create_stp_change_plan
    title: Create STP Change Plan
    cli: stp optimize
    pipeline: true
    credentials: none
    open_world: false
    description: Create convergence-aware STP priority change plan with rollback bundle
    priority: P2
    tags: [stp, change-plan, rollback, maintenance]
    parameters:
      changes:
        type: array
        required: true
        description: STPChange objects from calculate_optimal_priorities

  snapshot_stp_topology:
    module: unifi_mapper.analysis.stp_snapshot
    handler: snapshot_stp_topology
    title: Snapshot STP Topology
    cli: stp snapshot
    pipeline: true
    credentials: none
    open_world: false
    description: Create serializable STP topology snapshot
    priority: P2
    tags: [stp, snapshot, diff, baseline]
    parameters:
      topology:
        type: object
        required: true
        description: STPTopology from discover_stp_topology

  diff_stp_snapshots:
    module: unifi_mapper.analysis.stp_snapshot
    handler: diff_stp_snapshots
    title: Diff STP Snapshots
