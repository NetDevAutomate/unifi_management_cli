  get_radio_channel_report:
    module: unifi_mapper.analysis.channel_optimiser
    handler: get_radio_channel_report_mcp
    title: Get Radio Channel Report
    cli: radio report
    description: >-
      Generate a channel utilization report showing current state and recommended changes
      for all APs. For one device's radio and VAP counters, use get_device_stats.
    priority: P2
    tags: [wifi, radio, channel, report, utilization]

  snapshot_radio_config:
