    credentials: none
    open_world: false
    description: Diff two STP topology snapshots
    priority: P2
    tags: [stp, snapshot, diff, drift]
    parameters:
      before:
        type: object
        required: true
        description: STPSnapshot from snapshot_stp_topology (earlier)
      after:
        type: object
        required: true
        description: STPSnapshot from snapshot_stp_topology (later)

