category: network
description: Network control plane managers for UniFi infrastructure

tools:
  get_firewall_zones:
    module: unifi_mapper.mcp.tools.network
    handler: get_firewall_zones
    title: Get Firewall Zones
    credentials: network_api
    description: List all firewall zones and their configurations
    priority: P1
    tags: [firewall, zones, security, configuration]

  get_firewall_policies:
    module: unifi_mapper.mcp.tools.network
    handler: get_firewall_policies
    title: Get Firewall Policies
    credentials: network_api
    description: List firewall policies between zones
    priority: P1
    tags: [firewall, policies, rules, security]

  get_acl_rules:
    module: unifi_mapper.mcp.tools.network
    handler: get_acl_rules
    title: Get ACL Rules
    credentials: network_api
    description: List ACL rules and their configurations
    priority: P1
    tags: [acl, rules, access-control, security]

  get_dns_policies:
    module: unifi_mapper.mcp.tools.network
    handler: get_dns_policies
    title: Get DNS Policies
    credentials: network_api
    description: List DNS policies and configurations
    priority: P2
    tags: [dns, policies, filtering, security]

  get_clients:
    module: unifi_mapper.mcp.tools.network
    handler: get_clients
    title: Get Clients
    credentials: network_api
    description: >-
      List connected clients with fingerprinting data, one page at a time, sorted by client
      ID. The controller's list is read in full and filtered first, so total counts every
      client that matches (only connected ones while active_only is true, the default);
      pass a page's next_offset as the next offset until it is null. Returns a page object,
      not a list. Read-only.
    priority: P1
    tags: [clients, devices, fingerprint, inventory, read-only]
    parameters:
      active_only:
        type: boolean
        description: Only currently connected clients (default true)
      limit:
        type: integer
        description: Clients per page, 1-1000 (default 200)
      offset:
        type: integer
        description: "Clients to skip: the next_offset of the page before (default 0)"

  get_networks:
    module: unifi_mapper.mcp.tools.network
    handler: get_networks
    title: Get Networks
    credentials: network_api
    description: >-
      List networks/VLANs and their configurations. For the full legacy network object,
      use get_config_object.
    priority: P1
    tags: [networks, vlans, configuration, layer2]
