category: diagnostics
description: Network health, performance, and security diagnostic tools

tools:
  network_health_check:
    module: unifi_mapper.diagnostics.network_health
    handler: network_health_check
    title: Network Health Check
    cli: diagnose health
    description: Overall infrastructure health monitoring and assessment
    priority: P1
    tags: [health, infrastructure, monitoring, diagnostic]

  run_all_diagnostics:
    module: unifi_mapper.diagnostics.run_all
    handler: run_all_diagnostics
    title: Run All Diagnostics
    cli: diagnose all
    description: >-
      Every read-only diagnostic in one run, with a PASS, WARN or FAIL per check: the fifteen
      infrastructure checks `unifi-mapper diagnose all` runs (link quality, capacity, port
      profiles, MTU, SFP, radio, firmware, DHCP pools, PoE and power budgets, client density,
      uplink redundancy and VLAN transparency, foreign bridges, telemetry freshness), each
      naming the tool that gives its detail. A check that cannot run is a FAIL with a
      one-line reason; the others still run. Fifteen controller reads, so slower than one
      tool. Read-only.
    priority: P1
    tags: [health, summary, diagnostic, composite, read-only]

  performance_analysis:
    module: unifi_mapper.diagnostics.performance_analysis
    handler: performance_analysis
    title: Performance Analysis
    cli: diagnose performance
    description: Network performance analysis and bottleneck identification
    priority: P1
    tags: [performance, bottleneck, analysis, throughput]

  security_audit:
    module: unifi_mapper.diagnostics.security_audit
    handler: security_audit
    title: Security Audit
    cli: diagnose security
    description: >-
      Security audit: unknown, unauthorised and anomalous devices, MAC anomalies, guest and
      VLAN violations, and rogue APs told apart from neighbours (a rogue impersonates one of
      this site's SSIDs, is flagged on the wired network by the controller, or is unadopted
      UniFi hardware heard on the premises)
    priority: P1
    tags: [security, audit, vulnerability, compliance]

  connectivity_analysis:
    module: unifi_mapper.diagnostics.connectivity_analysis
    handler: connectivity_analysis
    title: Connectivity Analysis
    cli: diagnose connectivity
    description: Connection troubleshooting and path analysis
    priority: P2
    tags: [connectivity, troubleshooting, path, diagnostic]

  inspect_switch_port:
    module: unifi_mapper.diagnostics.inspect_port
    handler: inspect_switch_port
    title: Inspect Switch Port
    cli: ports inspect
    description: >-
      Deep inspection of a single switch port: link state, effective VLAN and
      port profile, the connected device (UniFi or third-party, with fingerprint
      model and confidence), DHCP lease vs static addressing verdict, LLDP
      neighbour resolved to an adopted device, error counters and PoE state
    priority: P1
    tags: [port, vlan, dhcp, lldp, client, troubleshooting, diagnostic]
    parameters:
      switch:
        type: string
        required: true
        description: Switch name, model, IP or MAC (e.g. "Rack Switch 24")
      port:
        type: integer
        required: true
        description: Port index on the switch, 1-based

  diagnose_switch_port:
    module: unifi_mapper.diagnostics.port_diagnostics_tools
    handler: diagnose_switch_port
    title: Diagnose Switch Port
    cli: ports diagnose
    idempotent: false
    description: >-
      Read-only evidence bundle for one switch port, for vendor tickets. Switch
      identity and Network application version, the raw port_table entry with
      negotiation fields and raw speed_caps, the full port override with both
      profile ids side by side, an optional diff of two port profiles, where the
      controller places each client, events and system log, counter samples
      with the recorded counter history, every port on the switch and the
      Integration API port capability. Includes
      request_audit as proof that collection never wrote to the controller.
      counter_samples above 1 blocks for 100 s per extra sample.
    priority: P1
    tags: [port, diagnostic, evidence, negotiation, speed, profile, events, read-only]
    parameters:
      switch:
        type: string
        required: true
        description: 'Switch name, MAC or IP; an exact name or MAC always wins'
      port:
        type: integer
        required: true
        description: Port index on the switch, 1-based
      clients:
        type: array
        items: {type: string}
        description: Clients (MAC, IP or name) to locate; default is whatever is on the port
      compare_profiles:
        type: array
        items: {type: string}
        description: Exactly two port profile names or ids to diff
      since_days:
        type: integer
        description: History window in days (1-3650, default 365)
      counter_samples:
        type: integer
        description: Counter samples 100 s apart (1-5, default 1, which never blocks)
      max_events:
        type: integer
        description: Keep at most this many history matches (default 200)

  get_switch_ports:
    module: unifi_mapper.diagnostics.port_diagnostics_tools
    handler: get_switch_ports
    title: Get Switch Ports
    cli: ports list
    description: >-
      Every port on one switch with the switch identity. Per port the name,
      media, speed, duplex, autoneg, up, STP state, effective profile and whether
      an override sets it, raw speed_caps, PoE, LLDP neighbour, clients and
      error, CRC and link-down counters. Device model, firmware, uptime, state,
      system stats and thermal and power fields. Read-only.
    priority: P1
    tags: [port, switch, inventory, speed, lldp, diagnostic, read-only]
    parameters:
      switch:
        type: string
        required: true
        description: 'Switch name, MAC or IP; an exact name or MAC always wins'
      include_raw:
        type: boolean
        description: Include the full sanitised stat/device record

  diff_port_profiles:
    module: unifi_mapper.diagnostics.port_diagnostics_tools
    handler: diff_port_profiles
    title: Diff Port Profiles
    cli: ports profile-diff
    description: >-
      Key-by-key diff of two port profiles (rest/portconf) with identity and
      attr_* metadata kept separate, referenced networks resolved to names and
      VLANs, and every switch port that runs each profile with its live speed.
      Read-only.
    priority: P1
    tags: [port, profile, portconf, diff, vlan, diagnostic, read-only]
    parameters:
      profile_a:
        type: string
        required: true
        description: First port profile name or _id
      profile_b:
        type: string
        required: true
        description: Second port profile name or _id

  get_wan_health:
    module: unifi_mapper.diagnostics.wan_health
    handler: get_wan_health
    title: Get WAN Health
    cli: diagnose wan
    description: >-
      WAN and internet status from stat/health (ISP, WAN IP, gateway version, latency,
      drops, throughput) and the result of the controller's last scheduled speedtest. Never
      starts a speedtest. get_wan_speedtest_history lists the recorded results. Read-only.
    priority: P1
    tags: [wan, internet, isp, speedtest, health, read-only]

  get_wan_speedtest_history:
    module: unifi_mapper.diagnostics.wan_history
    handler: get_wan_speedtest_history
    title: Get WAN Speedtest History
    cli: diagnose wan-history
    credentials: none
    open_world: false
    description: >-
      WAN speedtest results recorded by `unifi-mapper diagnose wan --record` (hourly when
      scheduled), newest first, from the history file under the XDG state directory. Needs
      no credentials and sends no request; an empty history returns a note on how to record.
      Read-only.
    priority: P2
    tags: [wan, speedtest, history, trend, read-only]
    parameters:
      limit:
        type: integer
        description: At most this many results, newest first (1-1000, default 100)

  verify_config_backup:
    module: unifi_mapper.backup.verify
    handler: verify_config_backup
    title: Verify Config Backup
    cli: backup verify
    credentials: none
    open_world: false
    description: >-
      Check a downloaded UniFi config backup (.unf) offline: does it decrypt, extract and
      decompress, and how many documents does each collection hold (device, networkconf,
      wlanconf, setting and the rest)? The backup is not valid when a document fails to
      decode or bytes follow the last whole document (a truncated download). Reports
      structure only, never document contents: known collection names (others counted as
      other) and the version only when it is a version number.
      The path must be absolute, end in .unf and name a regular file of at most 512 MiB;
      the database member and the decompressed database are each capped at 1 GiB, an
      oversized member is refused before it is inflated, and a database of more than 64
      gzip members is refused. Contacts no controller. Read-only.
    priority: P2
    tags: [backup, restore, verify, offline, read-only]
    parameters:
      path:
        type: string
        required: true
        description: Absolute path of a .unf backup file on this machine
