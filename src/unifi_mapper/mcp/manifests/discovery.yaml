category: discovery
description: Device and client discovery tools for network exploration

tools:
  find_device:
    module: unifi_mapper.discovery.find_device
    handler: find_device
    title: Find Device
    cli: find device
    aliases:
      query: identifier
    description: >-
      Search for devices by name, IP address, or MAC address. For one device's radio and
      VAP counters, use get_device_stats.
    priority: P1
    tags: [device, search, find, inventory]
    parameters:
      identifier:
        type: string
        required: true
        description: Device name, IP, MAC or model to search for

  find_ip:
    module: unifi_mapper.discovery.find_ip
    handler: find_ip
    title: Find IP
    cli_gap: 'not yet built: find device covers devices only'
    aliases:
      ip_address: ip
    description: Locate device and port by IP address
    priority: P1
    tags: [ip, locate, port, layer3]
    parameters:
      ip:
        type: string
        required: true
        description: IPv4 address to locate

  find_mac:
    module: unifi_mapper.discovery.find_mac
    handler: find_mac
    title: Find MAC
    cli_gap: 'not yet built: find device covers devices only'
    aliases:
      mac_address: mac
    description: MAC address location tracking across the network
    priority: P1
    tags: [mac, locate, tracking, layer2]
    parameters:
      mac:
        type: string
        required: true
        description: MAC address to locate (any format)

  client_trace:
    module: unifi_mapper.discovery.client_trace
    handler: client_trace
    title: Client Trace
    cli_gap: 'not yet built: the client trace has no command'
    aliases:
      client_id: client
    description: End-to-end client path analysis through the network
    priority: P2
    tags: [client, trace, path, troubleshooting]
    parameters:
      client:
        type: string
        required: true
        description: Client MAC, IP, hostname or name

  get_client_history:
    module: unifi_mapper.diagnostics.port_diagnostics_tools
    handler: get_client_history
    title: Get Client History
    cli: ports client
    description: >-
      Where the controller places a client, across stat/sta, v2 clients/active,
      v2 clients/history, rest/user and stat/user, including offline records and
      previous ports and link rates. With switch and port, each record is checked
      against that port from its own location fields, independently of how it
      was found. Read-only.
    priority: P1
    tags: [client, mac, history, locate, port, layer2, read-only]
    parameters:
      client:
        type: string
        required: true
        description: Client MAC (any notation), IP, or a name or hostname substring
      switch:
        type: string
        description: Switch to check each record against
      port:
        type: integer
        description: Port on that switch to check against (needs switch)
