category: protect
description: UniFi Protect integration for camera and security management

tools:
  get_cameras:
    module: unifi_mapper.mcp.tools.protect
    handler: get_cameras
    title: Get Cameras
    cli_gap: 'raw read: controller objects the UniFi UI already shows'
    credentials: protect
    description: List all cameras and their status
    priority: P1
    tags: [cameras, devices, inventory, status]

  get_nvr_info:
