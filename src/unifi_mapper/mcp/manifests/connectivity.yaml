category: connectivity
description: Network path tracing and connectivity analysis tools

tools:
  firewall_check:
    module: unifi_mapper.connectivity.firewall_check
    handler: firewall_check
    title: Firewall Check
    cli: diagnose firewall
    description: Verify firewall rules and policies affecting traffic flow
    priority: P1
    tags: [firewall, rules, policy, security]
    parameters:
      source:
        type: string
        required: true
        description: Source IP, network, VLAN name or VLAN ID
      destination:
        type: string
        required: true
        description: Destination IP, network, VLAN name or VLAN ID
      protocol:
        type: string
        default: all
        description: Protocol to check (tcp, udp, icmp, all)
      port:
        type: string
        description: Destination port or range, e.g. "443" or "1000-2000"

  path_analysis:
    module: unifi_mapper.connectivity.path_analysis
    handler: path_analysis_mcp
    title: Path Analysis
    cli: diagnose path
    description: Network path analysis between two endpoints
    priority: P1
    tags: [path, analysis, routing, layer3]
    parameters:
      path:
        type: object
        description: NetworkPath from traceroute; omit when giving source/destination
      source:
        type: string
        description: Source endpoint (IP, MAC or name); needs destination
      destination:
        type: string
        description: Destination endpoint (IP, MAC or name); needs source

  check_inter_vlan_routing:
    module: unifi_mapper.connectivity.inter_vlan
    handler: check_inter_vlan_routing
    title: Check Inter-VLAN Routing
    cli: diagnose inter-vlan
    description: Check endpoint VLANs and firewall verdict for inter-VLAN routing
    priority: P1
    tags: [vlan, inter-vlan, routing, firewall, endpoint]
    parameters:
      source:
        type: string
        required: true
        description: Source endpoint IP, MAC, hostname, or device name
      destination:
        type: string
        required: true
        description: Destination endpoint IP, MAC, hostname, or device name
      protocol:
        type: string
        default: icmp
        description: Protocol to check
      port:
        type: string
        required: false
        description: Optional destination port

  traceroute:
    module: unifi_mapper.connectivity.traceroute
    handler: traceroute
    title: Traceroute
    cli: diagnose path
    description: Layer 3 path tracing to destination
    priority: P2
    tags: [traceroute, path, hops, layer3]
    parameters:
      source:
        type: string
        required: true
        description: Source endpoint (IP, MAC, hostname or "gateway")
      destination:
        type: string
        required: true
        description: Destination endpoint (IP, MAC, hostname or "internet")
      include_firewall:
        type: boolean
        default: true
        description: Check firewall rules along the path
      verbosity:
        type: string
        default: guided
        description: guided (plain English) or expert (technical detail)

  # Active probes (issue 092): each runs one command on the gateway over SSH, as
  # UNIFI_SSH_USERNAME, after the gateway's host key is verified (issue 038). Held back from
  # every surface unless the server starts with UNIFI_MCP_ALLOW_ACTIVE_PROBES=1.
  gateway_ping:
    module: unifi_mapper.connectivity.gateway_probe
    handler: gateway_ping
    title: Gateway Ping
    cli: gateway ping
    active_probe: true
    description: >-
      Runs ping on the gateway over SSH: loss and round trips from the gateway to one
      target, through the real forwarding path. A name resolves through the controller.
    priority: P1
    tags: [ping, latency, loss, reachability, gateway, ssh, probe]
    parameters:
      target:
        type: string
        required: true
        description: An IP, or a device or client name, hostname or MAC (or a unique part of a name)
      count:
        type: integer
        default: 10
        description: Echo requests (1-100)
      interval:
        type: number
        default: 0.3
        description: Seconds between requests (0.2-5.0)

  gateway_traceroute:
    module: unifi_mapper.connectivity.gateway_probe
    handler: gateway_traceroute
    title: Gateway Traceroute
    cli: gateway traceroute
    active_probe: true
    description: >-
      Runs traceroute on the gateway over SSH: the gateway's real forwarding path to one
      target, hop by hop; reached only when the last hop is the target and answered.
    priority: P1
    tags: [traceroute, path, hops, routing, gateway, ssh, probe]
    parameters:
      target:
        type: string
        required: true
        description: An IP, or a device or client name, hostname or MAC (or a unique part of a name)
      max_hops:
        type: integer
        default: 20
        description: Hops to probe (1-30)

  gateway_dns_check:
    module: unifi_mapper.connectivity.gateway_probe
    handler: gateway_dns_check
    title: Gateway DNS Check
    cli: gateway dns
    active_probe: true
    description: >-
      Runs nslookup on the gateway over SSH: resolves one hostname as the gateway does,
      or against one DNS server.
    priority: P1
    tags: [dns, nslookup, resolve, gateway, ssh, probe]
    parameters:
      hostname:
        type: string
        required: true
        description: The hostname to resolve (letters, digits, hyphens and dots)
      server:
        type: string
        description: A DNS server's IP address to ask instead of the gateway's own
