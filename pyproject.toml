[project]
name = "unifi-management-cli"
version = "0.2.0"
description = "Enterprise-grade UniFi network automation and management CLI"
readme = "README.md"
requires-python = ">=3.12"
# Bound policy: the floor is the locked, tested version; the ceiling is the next major, or the
# next minor for 0.x packages. uvx ignores uv.lock, so these bounds are all a uvx user gets.
# mcp is pinned to one minor because the MCP server relies on FastMCP internals that aren't
# public API; widen it one minor at a time, after `uv lock --upgrade-package mcp` and
# `uv run pytest --run-slow tests/mcp/test_packaging.py` pass on the new minor.
dependencies = [
    "mcp>=1.30,<1.31",  # Model Context Protocol SDK (includes FastMCP)
    "anyio>=4.12,<5",
    "pydantic>=2.12,<3",
    "httpx>=0.28.1,<0.29",
    "loguru>=0.7.3,<0.8",
    "rich>=14.2,<15",
    "typer>=0.21,<0.22",
    "keyring>=25.7,<26",
    "requests>=2.32.5,<3",
    "graphviz>=0.21,<0.22",
    "pycryptodome>=3.23,<4",  # AES decryption for UniFi backups
    "pymongo>=4.16,<5",  # BSON parsing for backup database
    "onvif-zeep-async>=4.0.4,<5",
    "uiprotect>=8.1.1,<9",  # UniFi Protect async API client
    "pyyaml>=6.0.3,<7",  # YAML manifest parsing for MCP tools
    "asyncssh>=2.22,<3",
]
license = { text = "MIT" }
authors = [{ name = "ataylor" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
"unifi-mapper" = "unifi_mapper.typer_cli:app"
"unifi-network-toolkit" = "unifi_mapper.network_cli:main"
"unifi-inventory" = "unifi_mapper.inventory_cli:main"
"unifi-mcp" = "unifi_mapper.mcp.server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_mapper"]

[tool.hatch.build.targets.sdist]
include = ["src/unifi_mapper"]

[tool.ruff]
line-length = 99
extend-include = ["*.ipynb"]
exclude = [
    ".venv",
    "**/__pycache__",
    "**/node_modules",
    "**/dist",
    "**/build",
    "**/env",
    "**/.ruff_cache",
    "**/.venv",
]
force-exclude = true

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["C", "D", "E", "F", "I", "W"]
ignore = ["C901", "E501", "E741", "F402", "F823", "D100", "D104", "D106"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
lines-after-imports = 2
no-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "**/dist",
    "**/build",
    "src/unifi_mapper/analyze_network_capabilities.py",
    "src/unifi_mapper/browser_verification.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests that make live API calls (deselect with '-m \"not live\"')",
    "asyncio: marks tests that use asyncio",
    "network: marks tests that need network access (skipped unless --run-slow or UNIFI_RUN_SLOW=1)",
    "credential_chain: marks tests that exercise the credential fallback chain",
]

[tool.coverage.run]
source = ["src/unifi_mapper"]
branch = true

[tool.coverage.report]
exclude_also = [
    'pragma: no cover',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
]
fail_under = 90
